<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6db"/>
      <stop offset="35%" stop-color="#e5bd72"/>
      <stop offset="100%" stop-color="#8c5d14"/>
    </linearGradient>
    <radialGradient id="divineAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5bd72" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#a98ae8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0714" stop-opacity="0"/>
    </radialGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .crown-levitate { animation: floatCrown 4s ease-in-out infinite alternate; transform-origin: 160px 110px; }
    .wing-left { animation: flapLeft 3s ease-in-out infinite alternate; transform-origin: 110px 110px; }
    .wing-right { animation: flapRight 3s ease-in-out infinite alternate; transform-origin: 210px 110px; }
    .ray-rotate { animation: spinRays 20s linear infinite; transform-origin: 160px 105px; }
    .gem-pulse { animation: pulseGems 2.4s ease-in-out infinite; }
    @keyframes floatCrown { 0% { transform: translateY(4px); } 100% { transform: translateY(-7px); } }
    @keyframes flapLeft { 0% { transform: rotate(-3deg); } 100% { transform: rotate(5deg); } }
    @keyframes flapRight { 0% { transform: rotate(3deg); } 100% { transform: rotate(-5deg); } }
    @keyframes spinRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseGems { 0%, 100% { filter: drop-shadow(0 0 3px #fff); } 50% { filter: drop-shadow(0 0 10px #e5bd72); } }
  </style>

  <!-- Aura & Radiant Sunburst Rays -->
  <circle cx="160" cy="105" r="90" fill="url(#divineAura)"/>
  <g class="ray-rotate" opacity="0.35" stroke="#e5bd72" stroke-width="1.2">
    <line x1="160" y1="15" x2="160" y2="195"/>
    <line x1="70" y1="105" x2="250" y2="105"/>
    <line x1="95" y1="40" x2="225" y2="170"/>
    <line x1="95" y1="170" x2="225" y2="40"/>
  </g>

  <!-- Wings of Hermes/Zeus -->
  <g class="wing-left" opacity="0.75">
    <path d="M110 110 C85 85 55 90 40 110 C60 120 85 118 110 115" fill="none" stroke="url(#crownGold)" stroke-width="2"/>
    <path d="M105 115 C80 98 60 105 50 125 C70 130 90 125 105 120" fill="none" stroke="url(#crownGold)" stroke-width="1.5"/>
  </g>
  <g class="wing-right" opacity="0.75">
    <path d="M210 110 C235 85 265 90 280 110 C260 120 235 118 210 115" fill="none" stroke="url(#crownGold)" stroke-width="2"/>
    <path d="M215 115 C240 98 260 105 270 125 C250 130 230 125 215 120" fill="none" stroke="url(#crownGold)" stroke-width="1.5"/>
  </g>

  <!-- Levitation Assembly for Crown & Laurels -->
  <g class="crown-levitate">
    <!-- Olympian Golden Crown -->
    <path d="M105 135 L115 80 L138 110 L160 65 L182 110 L205 80 L215 135 Z" 
          fill="url(#crownGold)" stroke="#fff" stroke-width="1.5" filter="url(#royalGlow)"/>
    <!-- Crown Base Band -->
    <rect x="100" y="135" width="120" height="12" rx="3" fill="#3b205a" stroke="url(#crownGold)" stroke-width="2"/>
    <!-- Band Filigree Inlay -->
    <line x1="105" y1="141" x2="215" y2="141" stroke="#e5bd72" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Sacred Gems on Crown Peaks -->
    <circle class="gem-pulse" cx="160" cy="65" r="5" fill="#f8fafc"/> <!-- Central Diamond -->
    <polygon points="115,75 120,80 115,85 110,80" fill="#a98ae8"/> <!-- Left Amethyst -->
    <polygon points="205,75 210,80 205,85 200,80" fill="#82c9a5"/> <!-- Right Emerald -->
    <circle cx="138" cy="110" r="3.5" fill="#e5bd72"/>
    <circle cx="182" cy="110" r="3.5" fill="#e5bd72"/>

    <!-- Laurel Wreath of Ascension below Crown -->
    <path d="M90 148 Q100 170 160 178 Q220 170 230 148" fill="none" stroke="url(#crownGold)" stroke-width="2.5" filter="url(#royalGlow)"/>
    <!-- Laurel Leaves -->
    <path d="M105 158 Q115 162 112 150" fill="url(#crownGold)"/>
    <path d="M130 168 Q140 172 138 160" fill="url(#crownGold)"/>
    <path d="M190 168 Q180 172 182 160" fill="url(#crownGold)"/>
    <path d="M215 158 Q205 162 208 150" fill="url(#crownGold)"/>
  </g>
</svg>