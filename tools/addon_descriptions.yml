# Descripciones por addon (slug: es / en). Editable a mano; el generador las lee en cada corrida.
# Regla: solo hechos que se vean en los datos (categorias, items destacados); si hay duda, texto generico.
coloredenderchests:
  es: Cofres de Ender de colores en tamaño pequeño y grande; cada combinación de tres colores es un ítem distinto, por eso hay miles de variantes.
  en: Colored Ender Chests in small and big sizes; every three-colour combination is a separate item, which is why there are thousands of variants.
slimechem:
  es: Addon con una gran cantidad de ítems de química; la lista viva no trae categorías, así que aquí ves nombre, máquina y receta de cada uno.
  en: Addon with a very large number of chemistry-related items; the live list has no categories, so each item shows its name, machine and recipe.
cultivation:
  es: Cultivos y plantas con sus productos y subproductos, como arvejas, pimentón u hojas de curry.
  en: Crops and plants with their produce and by-products, such as peas, bell pepper and curry leaf.
slimetinker:
  es: Sistema de partes, materiales y rasgos de metal para fabricar herramientas y armaduras, con moldes (casts) y diccionario de partes.
  en: Parts, materials and metal traits system for building tools and armor, with casts and a part dictionary.
slimefun:
  es: El Slimefun base del servidor: energía y electricidad, recursos, máquinas básicas, herramientas y objetos mágicos.
  en: The server's base Slimefun: energy and electricity, resources, basic machines, tools and magical items.
supreme:
  es: Addon tecnológico con TechMobs, tarjetas y componentes, además de aleaciones como el titanio.
  en: Tech addon with TechMobs, cards and components, plus alloys such as titanium.
foxymachines:
  es: Mezcla de bloques fantasma, materiales, herramientas y jefes con sus huevos de aparición y drops.
  en: A mix of ghost blocks, materials, tools and bosses with their spawn eggs and drops.
gastronomicon:
  es: Addon de cocina y comida de Slimefun; la lista viva no trae categorías para él.
  en: Slimefun cooking and food addon; the live list has no categories for it.
crystamaehistoria:
  es: Cristales históricos, semillas de Netheopoiesis y gadgets de tecnología mágica.
  en: Historia crystals, Netheopoiesis seeds and magical tech gadgets.
compressioncraft:
  es: Addon de compresión de materiales; la lista viva no trae categorías, solo nombre, máquina y receta.
  en: Material compression addon; the live list has no categories, only name, machine and recipe.
netheopoiesis:
  es: Semillas, pastas y bolas Netheo para cultivar y procesar recursos del Nether.
  en: Seeds, seed pastes and Netheo balls for growing and processing Nether resources.
exoticgarden:
  es: Plantas, frutas, comidas y bebidas exóticas.
  en: Exotic plants, fruits, food and drinks.
fnamplifications:
