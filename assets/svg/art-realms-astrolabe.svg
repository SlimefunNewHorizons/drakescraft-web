<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="compassCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4da"/>
      <stop offset="50%" stop-color="#e5bd72"/>
      <stop offset="100%" stop-color="#24143a"/>
    </radialGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .spin-ring-1 { animation: spinCW 22s linear infinite; transform-origin: 160px 110px; }
    .spin-ring-2 { animation: spinCCW 16s linear infinite; transform-origin: 160px 110px; }
    .needle-sway { animation: swayNeedle 4s ease-in-out infinite alternate; transform-origin: 160px 110px; }
    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes swayNeedle { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }
  </style>

  <!-- Armillary Outer Ring -->
  <circle cx="160" cy="110" r="86" fill="none" stroke="rgba(169, 138, 232, 0.35)" stroke-width="2"/>
  <circle cx="160" cy="110" r="80" fill="#140d24" opacity="0.8"/>

  <!-- Rotating Astrolabe Meridian 1 (with 3 Realm Orbs) -->
  <g class="spin-ring-1">
    <ellipse cx="160" cy="110" rx="76" ry="35" fill="none" stroke="#e5bd72" stroke-width="1.8" filter="url(#starGlow)"/>
    <!-- Realm 1: Slimefun (Green) -->
    <circle cx="236" cy="110" r="5" fill="#82c9a5" filter="url(#starGlow)"/>
    <!-- Realm 2: Clásico (Blue) -->
    <circle cx="84" cy="110" r="5" fill="#64d8cb"/>
    <!-- Realm 3: SkyBlock (Cyan) -->
    <circle cx="160" cy="75" r="4.5" fill="#a98ae8"/>
  </g>

  <!-- Rotating Astrolabe Meridian 2 (with 3 Realm Orbs) -->
  <g class="spin-ring-2">
    <ellipse cx="160" cy="110" rx="35" ry="76" fill="none" stroke="#a98ae8" stroke-width="1.8"/>
    <!-- Realm 4: OneBlock (Gold) -->
    <circle cx="160" cy="34" r="5" fill="#e5bd72" filter="url(#starGlow)"/>
    <!-- Realm 5: Laboratorio (Purple) -->
    <circle cx="160" cy="186" r="4.5" fill="#f472b6"/>
    <!-- Realm 6: OneChunk (White) -->
    <circle cx="125" cy="110" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Navigational Compass Rose Center -->
  <circle cx="160" cy="110" r="22" fill="url(#compassCenter)" stroke="#fff" stroke-width="1.5" filter="url(#starGlow)"/>

  <!-- Compass Star Needle -->
  <g class="needle-sway">
    <!-- North Arrow (Gold) -->
    <polygon points="160,110 155,106 160,72 165,106" fill="#e5bd72"/>
    <!-- South Arrow (Muted Violet) -->
    <polygon points="160,110 155,114 160,148 165,114" fill="#a98ae8"/>
    <circle cx="160" cy="110" r="4" fill="#ffffff"/>
  </g>
</svg>