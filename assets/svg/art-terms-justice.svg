<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="50%" stop-color="#e5bd72"/>
      <stop offset="100%" stop-color="#9a7428"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a98ae8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#552f9c" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a98ae8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#e5bd72" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#100c19" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .aura-bg { animation: pulseAura 4s ease-in-out infinite; transform-origin: center; }
    .beam { animation: swayBeam 5s ease-in-out infinite; transform-origin: 160px 55px; }
    .pan-left { animation: counterLeft 5s ease-in-out infinite; transform-origin: 85px 125px; }
    .pan-right { animation: counterRight 5s ease-in-out infinite; transform-origin: 235px 125px; }
    .twinkle-1 { animation: twinkle 3s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 3s ease-in-out infinite 1.5s; }
    .rune { animation: runeFloat 4s ease-in-out infinite alternate; }
    @keyframes swayBeam { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
    @keyframes counterLeft { 0%, 100% { transform: rotate(3.5deg); } 50% { transform: rotate(-3.5deg); } }
    @keyframes counterRight { 0%, 100% { transform: rotate(3.5deg); } 50% { transform: rotate(-3.5deg); } }
    @keyframes pulseAura { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 0.9; transform: scale(1.04); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes runeFloat { 0% { transform: translateY(0); opacity: 0.4; } 100% { transform: translateY(-4px); opacity: 0.85; } }
  </style>

  <!-- Ambient Glow -->
  <circle class="aura-bg" cx="160" cy="110" r="95" fill="url(#aura)"/>

  <!-- Background Runes & Stars -->
  <g fill="#e5bd72">
    <circle class="twinkle-1" cx="60" cy="40" r="1.5"/>
    <circle class="twinkle-2" cx="260" cy="45" r="2"/>
    <circle class="twinkle-1" cx="280" cy="140" r="1.5"/>
    <circle class="twinkle-2" cx="45" cy="150" r="1.8"/>
  </g>

  <!-- Central Pillar & Base -->
  <path d="M140 185 L180 185 L172 170 L148 170 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="156" y="55" width="8" height="118" rx="2" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Pillar Accents -->
  <circle cx="160" cy="55" r="7" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="55" r="3.5" fill="#fdfcf7"/>
  <!-- Base Pedestal -->
  <rect x="130" y="185" width="60" height="7" rx="3" fill="url(#goldGrad)"/>
  <rect x="120" y="192" width="80" height="5" rx="2" fill="#583f7c" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Swaying Beam Assembly -->
  <g class="beam">
    <!-- Main Crossbar -->
    <path d="M75 53 Q160 48 245 53 L245 57 Q160 52 75 57 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="85" cy="55" r="4" fill="url(#goldGrad)"/>
    <circle cx="235" cy="55" r="4" fill="url(#goldGrad)"/>

    <!-- Left Chains -->
    <line x1="85" y1="55" x2="65" y2="120" stroke="#e5bd72" stroke-width="1.2" opacity="0.8"/>
    <line x1="85" y1="55" x2="105" y2="120" stroke="#e5bd72" stroke-width="1.2" opacity="0.8"/>
    <!-- Left Pan Assembly -->
    <g class="pan-left">
      <path d="M58 120 Q85 142 112 120 Z" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>
      <ellipse cx="85" cy="120" rx="27" ry="4" fill="#fff5da" opacity="0.5"/>
      <!-- Glowing Sacred Cube of Truth -->
      <polygon points="85,108 94,113 85,118 76,113" fill="#82c9a5" opacity="0.85"/>
      <polygon points="76,113 85,118 85,125 76,120" fill="#4d9b73" opacity="0.9"/>
      <polygon points="94,113 85,118 85,125 94,120" fill="#67ba8f" opacity="0.9"/>
    </g>

    <!-- Right Chains -->
    <line x1="235" y1="55" x2="215" y2="120" stroke="#e5bd72" stroke-width="1.2" opacity="0.8"/>
    <line x1="235" y1="55" x2="255" y2="120" stroke="#e5bd72" stroke-width="1.2" opacity="0.8"/>
    <!-- Right Pan Assembly -->
    <g class="pan-right">
      <path d="M208 120 Q235 142 262 120 Z" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)"/>
      <ellipse cx="235" cy="120" rx="27" ry="4" fill="#fff5da" opacity="0.5"/>
      <!-- Glowing Diamond of Honor -->
      <polygon points="235,107 243,115 235,123 227,115" fill="#a98ae8" opacity="0.9" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Divine Laurels around Base -->
  <path d="M125 180 Q110 155 125 135" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.75"/>
  <path d="M195 180 Q210 155 195 135" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.75"/>
</svg>