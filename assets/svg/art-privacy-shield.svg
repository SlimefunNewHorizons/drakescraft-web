<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="45%" stop-color="#e5bd72"/>
      <stop offset="100%" stop-color="#8a5e18"/>
    </linearGradient>
    <linearGradient id="emeraldData" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#82c9a5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#82c9a5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#82c9a5" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="shieldCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1744"/>
      <stop offset="60%" stop-color="#140d24"/>
      <stop offset="100%" stop-color="#080410"/>
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .pulse-shield { animation: shieldPulse 3.5s ease-in-out infinite; transform-origin: 160px 105px; }
    .key-hover { animation: keyFloat 4s ease-in-out infinite alternate; transform-origin: center; }
    .data-circuit { animation: circuitFlow 3s linear infinite; stroke-dasharray: 6 12; }
    .orbit-ring { animation: rotateRing 14s linear infinite; transform-origin: 160px 105px; }
    @keyframes shieldPulse { 0%, 100% { transform: scale(0.97); filter: drop-shadow(0 0 10px rgba(130, 201, 165, 0.25)); } 50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(229, 189, 114, 0.45)); } }
    @keyframes keyFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
    @keyframes circuitFlow { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <!-- Protective Orbiting Glyphs -->
  <circle class="orbit-ring" cx="160" cy="105" r="88" fill="none" stroke="rgba(169, 138, 232, 0.3)" stroke-width="1.2" stroke-dasharray="10 24 4 18"/>
  <circle cx="160" cy="17" r="3" fill="#e5bd72" class="orbit-ring"/>

  <!-- Main Aegis Shield Body -->
  <g class="pulse-shield">
    <!-- Outer Shield Crest -->
    <path d="M160 22 L225 50 C225 125 185 172 160 190 C135 172 95 125 95 50 Z" 
          fill="url(#shieldCore)" stroke="url(#shieldBorder)" stroke-width="3.5" filter="url(#bloom)"/>
    
    <!-- Inner Inscribed Hexagon Boundary -->
    <path d="M160 38 L210 60 C210 115 178 152 160 168 C142 152 110 115 110 60 Z" 
          fill="none" stroke="#82c9a5" stroke-width="1.4" opacity="0.75"/>

    <!-- Cryptographic Data Circuits -->
    <path class="data-circuit" d="M115 75 L140 75 L145 90 L175 90 L180 75 L205 75" 
          fill="none" stroke="url(#emeraldData)" stroke-width="2"/>
    <path class="data-circuit" d="M125 120 L145 120 L160 140 L175 120 L195 120" 
          fill="none" stroke="url(#emeraldData)" stroke-width="2"/>

    <!-- Central Mythic Keyhole / Cryptographic Core -->
    <g class="key-hover">
      <!-- Golden Radiant Eye & Keyhole -->
      <circle cx="160" cy="98" r="16" fill="url(#shieldBorder)" filter="url(#bloom)"/>
      <path d="M154 96 C154 91 166 91 166 96 C166 99 163 101 162 104 L164 116 L156 116 L158 104 C157 101 154 99 154 96 Z" fill="#140d24"/>
      <!-- Glowing Core Center -->
      <circle cx="160" cy="96" r="4.5" fill="#82c9a5"/>
    </g>
  </g>

  <!-- Stars & Data Nodes -->
  <circle cx="70" cy="50" r="2" fill="#82c9a5" opacity="0.6"/>
  <circle cx="250" cy="65" r="2" fill="#e5bd72" opacity="0.7"/>
  <circle cx="80" cy="160" r="1.5" fill="#a98ae8" opacity="0.5"/>
  <circle cx="240" cy="155" r="2" fill="#82c9a5" opacity="0.6"/>
</svg>